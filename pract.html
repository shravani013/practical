
<!DOCTYPE html>
<html>
<head>
    <title>My Colorful Website</title>
    <style>
        body {
            background: linear-gradient(to right, pink, purple);
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        .box {
            background-color: white;
            padding: 30px;
            margin: auto;
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 0 15px gray;
        }

        h1 {
            color: purple;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background-color: purple;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: deeppink;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Welcome! 🌸</h1>
        <p>This is my first colourful website.</p>
        <button onclick="alert('Hello! Welcome to my website!')">
            Click Me
        </button>
    </div>

</body>
</html>
